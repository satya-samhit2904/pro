<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Onboarding Form</title>
  <link rel="stylesheet" href="css/StudentStyle.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar__wrap">
      <a href="#" class="brand">
        <span class="brand__dot"></span> Student Portal
      </a>
    </div>
  </header>

  <main class="section container">
    <div class="form-card">
      <h2>Student Onboarding Form</h2>


      <form id="educatorForm">

  <!-- Step 1 -->
  <div class="form-step active" id="step1">
    <div class="form-group">
      <label>Student Name:</label>
      <input type="text" name="studentName" placeholder="Enter student name" required />
    </div>

    <div class="form-group">
      <label>Grade:</label>
      <select id="gradeSelect" name="grade" required>
        <option value="">Select Grade</option>
        <option value="1">Grade 1</option>
        <option value="2">Grade 2</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>

    <!-- Year field -->
    <div class="form-group" id="yearField" style="display:none;">
      <label>Year:</label>
      <input type="number" id="yearInput" name="year" min="1" placeholder="Enter year" />
      <p id="yearNote" class="note"></p>
    </div>



    <div class="form-group">
      <label>Name of the School:</label>
      <input type="text" name="schoolName" placeholder="Enter school name" required />
    </div>

    <div class="form-group">
      <label>Location:</label>
      <input type="text" name="location" placeholder="City, State" required />
    </div>

    <div class="form-group">
      <label>Curriculum:</label>
      <select id="curriculumSelect" name="curriculum" required>
        <option value="">Select Curriculum</option>
        <option value="CBSE">CBSE</option>
        <option value="ICSE">ICIC</option>
        <option value="IB">IB</option>
        <option value="State Board">State Board</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group" id="otherCurriculumField" style="display: none;">
      <label>Please specify:</label>
      <input type="text" id="otherCurriculumInput" name="otherCurriculum" placeholder="Enter curriculum name" />
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn--primary btn-next" id="next1">Next</button>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="form-step" id="step2">
    <div class="form-group">
      <label>Subjects:</label>
      <input type="text" name="subjects" placeholder="e.g., Math, Science" required />
    </div>

    <div class="form-group">
      <label>No. of days in a week:</label>
      <input type="number" id="daysInput" name="daysPerWeek" min="1" max="7" placeholder="e.g., 3" required />
      <p class="note">Please enter between 1 and 7 days.</p>
    </div>

    <div class="form-group">
      <label>Preferred Days:</label>
      <div class="days-grid">
        <label><input type="checkbox" value="Sunday" /> Sunday</label>
        <label><input type="checkbox" value="Monday" /> Monday</label>
        <label><input type="checkbox" value="Tuesday" /> Tuesday</label>
        <label><input type="checkbox" value="Wednesday" /> Wednesday</label>
        <label><input type="checkbox" value="Thursday" /> Thursday</label>
        <label><input type="checkbox" value="Friday" /> Friday</label>
        <label><input type="checkbox" value="Saturday" /> Saturday</label>
      </div>
      <p id="dayWarning" class="warning-text"></p>
    </div>

    <div class="form-group">
      <label for="startTime">Start Time:</label>
      <input type="time" id="startTime" name="startTime" required />
    </div>

    <div class="form-group">
      <label for="endTime">End Time:</label>
      <input type="time" id="endTime" name="endTime" required />
    </div>

    <small id="timeError" style="color: red; display: none;">
      Please ensure the time range is between 09:00 and 17:00, and End Time is after Start Time.
    </small>

    <div class="form-group">
      <label>Contact Number:</label>
      <input type="tel" name="contact" placeholder="+1234567890 or 1234567890" required />
    </div>

    <div class="form-group">
      <label>Email ID:</label>
      <input type="email" name="email" placeholder="name@example.com" required />
    </div>

    <div class="form-actions between">
      <button type="button" class="btn btn--outline btn-prev" id="back1">Back</button>
      <button type="submit" class="btn btn--primary">Submit</button>
    </div>
  </div>
</form>

    </div>
  </main>

<script src="js/Studentscript.js"></script>
</body>
</html>
